[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "arabic-nlp-mcp"
version = "0.4.0rc1"
description = "MCP server exposing Arabic NLP tools: normalization, dialect detection, sentiment analysis, and diacritization."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Mazen Abdullah Mohammed Abbas" }]
keywords = ["mcp", "arabic", "nlp", "dialect", "sentiment", "diacritization", "tashkeel"]
dependencies = [
    "mcp>=2.0.0,<3.0.0",
    "pydantic>=2.7,<3",
]

[project.optional-dependencies]
transformers = ["transformers>=4.40,<6", "torch>=2.0"]
dev = [
    "pytest>=9.0.3,<10",
    "pytest-cov>=5,<8",
    "hypothesis>=6.100,<7",
    "mypy>=1.11,<2",
    "pip-audit>=2.7,<3",
    "build>=1.2,<2",
    "twine>=5,<7",
    "ruff>=0.6,<1",
]

[project.scripts]
arabic-nlp-mcp = "arabic_nlp_mcp.server:main"
arabic-nlp-mcp-experimental = "arabic_nlp_mcp.server:main_experimental"
arabic-nlp = "arabic_nlp_mcp.cli:main"

[tool.setuptools.packages.find]
include = ["arabic_nlp_mcp*"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"
line-length = 100
extend-exclude = [".venv", ".clean-venv", "build", "dist"]

[tool.mypy]
python_version = "3.10"
strict = true
warn_unreachable = true

[[tool.mypy.overrides]]
module = "transformers"
ignore_missing_imports = true
